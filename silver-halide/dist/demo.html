<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Silver Halide — unbland</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,200..800&family=Martian+Mono:wdth,wght@75..112.5,100..800&display=swap" rel="stylesheet">
<style>
  :root{
    --chalk:#e8eae3; --chalk-deep:#dcdfd6; --graphite:#16181c; --graphite-soft:#4a4e47;
    --specimen:#0a0b0d; --cobalt:#2340ff; --rule:#c4c8bd;
    --ff-display:"Bricolage Grotesque",-apple-system,sans-serif;
    --ff-mono:"Martian Mono",ui-monospace,Menlo,monospace;
    --gutter:clamp(16px,4vw,56px);
  }
  *{box-sizing:border-box}
  html{background:var(--chalk);color:var(--graphite)}
  body{margin:0;font-family:var(--ff-display);-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid var(--cobalt);outline-offset:3px}
  ::selection{background:var(--cobalt);color:#fff}

  .mono{font-family:var(--ff-mono);font-size:12px;letter-spacing:.02em;
    font-variation-settings:"wdth" 90;color:var(--graphite-soft)}

  .sheet{max-width:1080px;margin:0 auto;padding:clamp(28px,6vh,72px) var(--gutter) 96px}
  .head{display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:1px solid var(--rule);padding-bottom:14px}
  .head h1{margin:0;font-size:15px;font-weight:700;letter-spacing:.02em}
  .head a{color:var(--cobalt);text-decoration:none;font-family:var(--ff-mono);font-size:12px}
  .head a:hover{text-decoration:underline}

  /* Grain is only legible against its own absence, so the specimen is three
     surfaces at once — the ones it is hardest to make work on — and the whole
     thing toggles. */
  .window{position:relative;margin-top:28px;display:grid;
    grid-template-columns:repeat(3,1fr);min-height:44vh;overflow:hidden}
  .panel{display:grid;place-items:end start;padding:18px}
  .panel span{font-family:var(--ff-mono);font-size:11px;letter-spacing:.06em;
    text-transform:uppercase}
  .p-light{background:var(--chalk-deep);color:var(--graphite-soft)}
  .p-dark{background:var(--specimen);color:#6f779e}
  /* A flat vector gradient: the exact thing grain exists to rescue. */
  .p-grad{color:#efe6ff;
    background:radial-gradient(120% 90% at 20% 15%, #4a3cff 0%, #2340ff 38%, #120a4a 100%)}

  @media (max-width:640px){ .window{grid-template-columns:1fr;min-height:0}
    .panel{min-height:132px} }

  .bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-top:18px}
  .toggle{font-family:var(--ff-mono);font-size:12px;letter-spacing:.06em;
    text-transform:uppercase;background:var(--cobalt);color:#fff;border:0;
    padding:11px 20px;cursor:pointer;border-radius:999px}
  .toggle[aria-pressed=false]{background:var(--graphite)}
  .toggle:hover{filter:brightness(1.1)}

  .controls{margin-top:30px;display:grid;gap:0;
    grid-template-columns:repeat(auto-fit,minmax(224px,1fr));
    border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
  .ctl{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:16px 18px}
  .ctl label{display:block;margin-bottom:9px}
  .ctl label b{display:block;font-family:var(--ff-mono);font-size:11px;font-weight:700;
    letter-spacing:.06em;text-transform:uppercase;color:var(--graphite)}
  .ctl label span{font-family:var(--ff-mono);font-size:11px;color:var(--graphite-soft)}
  input[type=range]{width:100%;accent-color:var(--cobalt);margin:0}
  select{width:100%;font-family:var(--ff-mono);font-size:12px;padding:6px 8px;
    border:1px solid var(--rule);background:var(--chalk-deep);color:var(--graphite);border-radius:0}

  .snippet{margin-top:30px}
  .snippet h2{font-family:var(--ff-mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;margin:0 0 10px}
  pre{margin:0;background:var(--specimen);color:#cdd3f5;padding:18px 20px;overflow-x:auto;
    font-family:var(--ff-mono);font-size:12.5px;line-height:1.65}
  .tok-k{color:#8e9bff}.tok-s{color:#9ee7c8}.tok-n{color:#f0c674}

  footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--rule);
    display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
  footer a{color:var(--cobalt)}
</style>
</head>
<body>
<div class="sheet">

  <div class="head">
    <h1>Silver Halide <span class="mono" style="font-weight:400">· v1.0.0 · free</span></h1>
    <a href="https://unbland.dev">unbland.dev</a>
  </div>

  <div class="window" id="window">
    <div class="panel p-light"><span>paper</span></div>
    <div class="panel p-dark"><span>near black</span></div>
    <div class="panel p-grad"><span>flat gradient</span></div>
  </div>

  <div class="bar">
    <button class="toggle" id="toggle" aria-pressed="true">Film is on</button>
    <p class="mono" style="margin:0">Toggle it. The difference is the product.</p>
  </div>

  <div class="controls">
    <div class="ctl">
      <label for="intensity"><b>intensity</b><span><i id="intensity-v">0.16</i> — above 0.3 it veils</span></label>
      <input type="range" id="intensity" min="0" max="0.5" step="0.01" value="0.16">
    </div>
    <div class="ctl">
      <label for="size"><b>size</b><span><i id="size-v">1</i> device px per grain cell</span></label>
      <input type="range" id="size" min="1" max="5" step="1" value="1">
    </div>
    <div class="ctl">
      <label for="fps"><b>fps</b><span><i id="fps-v">12</i> — 0 holds it still</span></label>
      <input type="range" id="fps" min="0" max="30" step="1" value="12">
    </div>
    <div class="ctl">
      <label for="blend"><b>blend</b><span>how it meets what is under it</span></label>
      <select id="blend">
        <option value="normal" selected>normal — works on anything</option>
        <option value="overlay">overlay — tonal, dies on black</option>
        <option value="soft-light">soft-light — gentler overlay</option>
        <option value="multiply">multiply — shadows only</option>
        <option value="screen">screen — highlights only</option>
      </select>
    </div>
    <div class="ctl">
      <label for="vignette"><b>vignette</b><span><i id="vignette-v">0.38</i> &mdash; the layer you actually see</span></label>
      <input type="range" id="vignette" min="0" max="0.85" step="0.01" value="0.38">
    </div>
    <div class="ctl">
      <label for="falloff"><b>falloff</b><span>clear until <i id="falloff-v">58</i>% out</span></label>
      <input type="range" id="falloff" min="0" max="90" step="2" value="58">
    </div>
    <div class="ctl">
      <label for="castAmount"><b>cast</b><span><i id="castAmount-v">0.06</i> of the stock's colour</span></label>
      <input type="range" id="castAmount" min="0" max="0.25" step="0.01" value="0.06">
    </div>
    <div class="ctl">
      <label for="cast"><b>stock</b><span>which film it pretends to be</span></label>
      <select id="cast">
        <option value="#ffb46b" selected>warm — tungsten</option>
        <option value="#ffd9a8">warm — print</option>
        <option value="#a8c8ff">cool — silver</option>
        <option value="#9effc8">cross-processed</option>
        <option value="">none</option>
      </select>
    </div>
    <div class="ctl">
      <label for="tile"><b>tile</b><span><i id="tile-v">200</i> px before it repeats</span></label>
      <input type="range" id="tile" min="80" max="400" step="20" value="200">
    </div>
    <div class="ctl">
      <label for="tint"><b>tint</b><span>monochrome, or a cast</span></label>
      <select id="tint">
        <option value="" selected>monochrome</option>
        <option value="#ffd9a8">warm — print</option>
        <option value="#a8c8ff">cool — silver</option>
        <option value="#2340ff">cobalt</option>
      </select>
    </div>
  </div>

  <div class="snippet">
    <h2>Your settings</h2>
    <pre id="code"></pre>
  </div>

  <footer class="mono">
    <span>Free under the Unbland Free Effect Licence. Keep the credit comment; don't resell it.</span>
    <a href="https://unbland.dev">More effects →</a>
  </footer>

</div>

<script src="../runtime/silver-halide.js"></script>
<script>
  const win = document.getElementById('window');
  const code = document.getElementById('code');
  const toggle = document.getElementById('toggle');
  let fx = null, on = true;

  function options() {
    return {
      intensity: +document.getElementById('intensity').value,
      size:      +document.getElementById('size').value,
      fps:       +document.getElementById('fps').value,
      blend:      document.getElementById('blend').value,
      tile:      +document.getElementById('tile').value,
      tint:       document.getElementById('tint').value,
      vignette:  +document.getElementById('vignette').value,
      falloff:   +document.getElementById('falloff').value,
      cast:       document.getElementById('cast').value,
      castAmount:+document.getElementById('castAmount').value,
    };
  }

  function render(o) {
    code.innerHTML =
      `<span class="tok-k">UnblandSilverHalide</span>.create();  <span class="tok-s">// the whole page</span>\n\n` +
      `<span class="tok-s">// or, with settings, on one section:</span>\n` +
      `<span class="tok-k">UnblandSilverHalide</span>.create(<span class="tok-s">'#hero'</span>, {\n` +
      `  intensity: <span class="tok-n">${o.intensity}</span>,\n` +
      `  size:      <span class="tok-n">${o.size}</span>,\n` +
      `  fps:       <span class="tok-n">${o.fps}</span>,\n` +
      `  blend:     <span class="tok-s">'${o.blend}'</span>,\n` +
      `  tile:      <span class="tok-n">${o.tile}</span>,\n` +
      (o.tint ? `  tint:      <span class="tok-s">'${o.tint}'</span>,\n` : '') +
      `  vignette:  <span class="tok-n">${o.vignette}</span>,\n` +
      `  falloff:   <span class="tok-n">${o.falloff}</span>,\n` +
      (o.cast ? `  cast:       <span class="tok-s">'${o.cast}'</span>,\n`
              + `  castAmount: <span class="tok-n">${o.castAmount}</span>,\n` : '') +
      `});`;
  }

  /* size, tile and tint change the texture itself, so those rebuild. The rest
     goes through setConfig, which is what the effect is built for. */
  function build(rebuild) {
    const o = options();
    document.getElementById('intensity-v').textContent = o.intensity.toFixed(2);
    document.getElementById('size-v').textContent = o.size;
    document.getElementById('fps-v').textContent = o.fps;
    document.getElementById('tile-v').textContent = o.tile;
    document.getElementById('vignette-v').textContent = o.vignette.toFixed(2);
    document.getElementById('falloff-v').textContent = o.falloff;
    document.getElementById('castAmount-v').textContent = o.castAmount.toFixed(2);
    render(o);
    if (!on) return;
    if (rebuild || !fx) {
      if (fx) fx.destroy();
      fx = UnblandSilverHalide.create(win, o);
    } else {
      fx.setConfig(o);
    }
  }

  for (const id of ['intensity','fps','blend','vignette','falloff','castAmount']) {
    document.getElementById(id).addEventListener('input', () => build(false));
  }
  /* size and tint are baked into the texture, and a cast or vignette that
     starts at zero has no layer to retune — those need a rebuild. */
  for (const id of ['size','tile','cast']) {
    document.getElementById(id).addEventListener('input', () => build(true));
  }
  document.getElementById('tint').addEventListener('input', () => build(true));

  toggle.addEventListener('click', () => {
    on = !on;
    toggle.setAttribute('aria-pressed', String(on));
    toggle.textContent = on ? 'Film is on' : 'Film is off';
    if (on) build(true);
    else if (fx) { fx.destroy(); fx = null; }
  });

  build(true);
</script>
</body>
</html>
